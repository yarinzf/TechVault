name: Rotate Production Credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ROTATE_PRODUCTION to continue'
        required: true
      mode:
        description: 'Choose audit first (read-only). Use apply only after reviewing the audit.'
        required: true
        type: choice
        options:
          - audit
          - apply
        default: audit

concurrency:
  group: production-rotate-credentials
  cancel-in-progress: false

env:
  SSH_KEY_PATH: /home/runner/.ssh/deploy_key

jobs:
  rotate:
    name: Rotate demo/privileged account passwords on EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.confirmation }}" != "ROTATE_PRODUCTION" ]; then
            echo "::error::confirmation input must be exactly ROTATE_PRODUCTION (got: '${{ inputs.confirmation }}')"
            exit 1
          fi
          if [ "${{ inputs.mode }}" != "audit" ] && [ "${{ inputs.mode }}" != "apply" ]; then
            echo "::error::mode must be 'audit' or 'apply' (got: '${{ inputs.mode }}')"
            exit 1
          fi
          echo "Confirmation accepted. Mode: ${{ inputs.mode }}"

      # ── Same SSH setup pattern as deploy.yml / other production workflows ──
      - name: Configure SSH
        env:
          _HOST: ${{ secrets.EC2_HOST }}
          _USER: ${{ secrets.EC2_USER }}
          _KEY:  ${{ secrets.EC2_SSH_KEY }}
        run: |
          MISSING=0
          if [ -n "$_HOST" ]; then echo "EC2_HOST: present";    else echo "::error::EC2_HOST: MISSING";    MISSING=1; fi
          if [ -n "$_USER" ]; then echo "EC2_USER: present";    else echo "::error::EC2_USER: MISSING";    MISSING=1; fi
          if [ -n "$_KEY" ];  then echo "EC2_SSH_KEY: present"; else echo "::error::EC2_SSH_KEY: MISSING"; MISSING=1; fi
          if [ "$MISSING" -eq 1 ]; then echo "::error::One or more required secrets are missing"; exit 1; fi

          mkdir -p "$(dirname "$SSH_KEY_PATH")"
          printf '%s\n' "$_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          ssh-keyscan -H "$_HOST" >> "$(dirname "$SSH_KEY_PATH")/known_hosts" 2>/dev/null || echo "::warning::ssh-keyscan failed (non-fatal)"
          echo "SSH configured successfully"

      - name: Sync repository to latest main (script must exist on the server)
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd /opt/techvault &&
            git fetch origin &&
            git reset --hard origin/main &&
            chmod +x devops/scripts/*.sh
          '

      # ── Same reasoning as the other backfill workflows: `git reset --hard`
      #    only updates files on the EC2 HOST, never a running container's
      #    filesystem. Copy just this one new script into the already-
      #    running backend container. ──────────────────────────────────────
      - name: Inject rotation script into running backend container
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            cd /opt/techvault

            test -f server/scripts/rotateProductionCredentials.js || {
              echo "::error::Script not found on host after sync: /opt/techvault/server/scripts/rotateProductionCredentials.js"
              exit 1
            }

            BACKEND_CONTAINER=$(docker compose ps -q backend)
            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "::error::backend container is not running (docker compose ps -q backend returned empty)"
              exit 1
            fi
            echo "Backend container: $BACKEND_CONTAINER"

            docker cp \
              server/scripts/rotateProductionCredentials.js \
              "${BACKEND_CONTAINER}:/app/server/scripts/rotateProductionCredentials.js"

            docker compose exec -T backend test -f /app/server/scripts/rotateProductionCredentials.js || {
              echo "::error::Script missing inside container after docker cp"
              exit 1
            }
            docker compose exec -T backend node --check /app/server/scripts/rotateProductionCredentials.js || {
              echo "::error::Copied script failed node --check inside the container"
              exit 1
            }
            echo "Script injected and verified inside the running backend container."
          '

      # ── Audit mode: read-only, no new passwords needed, no backup needed. ──
      - name: "[audit] Read-only account status (no writes)"
        if: ${{ inputs.mode == 'audit' }}
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd /opt/techvault &&
            docker compose exec -T \
              -e ROTATE_CONFIRM=TECHVAULT_PRODUCTION \
              backend node server/scripts/rotateProductionCredentials.js --audit
          '

      # ── Apply mode: backup is mandatory and MUST happen before any write. ──
      - name: "[apply] Pre-rotation MongoDB backup"
        if: ${{ inputs.mode == 'apply' }}
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'sudo /opt/techvault/devops/scripts/backup-mongo.sh'

      - name: "[apply] Verify backup exists and is non-empty"
        if: ${{ inputs.mode == 'apply' }}
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            LATEST=$(ls -t /opt/techvault/backups/mongodb/techvault_*.gz 2>/dev/null | head -1)
            if [ -z "$LATEST" ]; then
              echo "::error::No backup archive found after backup step"
              exit 1
            fi
            SIZE=$(stat -c%s "$LATEST")
            echo "Latest backup: $LATEST ($SIZE bytes)"
            if [ "$SIZE" -le 0 ]; then
              echo "::error::Backup file is empty"
              exit 1
            fi
          '

      # ── Apply — required-secret presence check only, no values printed. ────
      #    Every target needs BOTH its new-password AND old-password
      #    (verification-only) secret set to be rotated this run; a target
      #    missing either is safely skipped by the script itself. This step
      #    is purely informational so the run is self-documenting.
      - name: "[apply] Report which rotation targets are configured (no values printed)"
        if: ${{ inputs.mode == 'apply' }}
        env:
          SUPERADMIN_NEW: ${{ secrets.ROTATE_SUPERADMIN_NEW_PASSWORD }}
          SUPERADMIN_OLD: ${{ secrets.ROTATE_SUPERADMIN_OLD_PASSWORD }}
          ADMIN_NEW:      ${{ secrets.ROTATE_ADMIN_NEW_PASSWORD }}
          ADMIN_OLD:      ${{ secrets.ROTATE_ADMIN_OLD_PASSWORD }}
          WAREHOUSE_NEW:  ${{ secrets.ROTATE_WAREHOUSE_NEW_PASSWORD }}
          WAREHOUSE_OLD:  ${{ secrets.ROTATE_WAREHOUSE_OLD_PASSWORD }}
          ALICE_NEW:      ${{ secrets.ROTATE_ALICE_NEW_PASSWORD }}
          ALICE_OLD:      ${{ secrets.ROTATE_ALICE_OLD_PASSWORD }}
          BOB_NEW:        ${{ secrets.ROTATE_BOB_NEW_PASSWORD }}
          BOB_OLD:        ${{ secrets.ROTATE_BOB_OLD_PASSWORD }}
          CAROL_NEW:      ${{ secrets.ROTATE_CAROL_NEW_PASSWORD }}
          CAROL_OLD:      ${{ secrets.ROTATE_CAROL_OLD_PASSWORD }}
        run: |
          for KEY in SUPERADMIN ADMIN WAREHOUSE ALICE BOB CAROL; do
            NEW_VAR="${KEY}_NEW"; OLD_VAR="${KEY}_OLD"
            NEW_SET="unset"; OLD_SET="unset"
            [ -n "${!NEW_VAR:-}" ] && NEW_SET="present"
            [ -n "${!OLD_VAR:-}" ] && OLD_SET="present"
            if [ "$NEW_SET" == "present" ] && [ "$OLD_SET" == "present" ]; then
              echo "$KEY: new=present, old=present -> will be rotated this run"
            else
              echo "$KEY: new=$NEW_SET, old=$OLD_SET -> will be SKIPPED this run"
            fi
          done

      # ── Apply — new AND old-verification passwords are read ONLY from
      #    GitHub secrets, passed as container-scoped env vars, never
      #    echoed, never written to disk on the runner, never appear as a
      #    CLI argument. Only targets with BOTH secrets set get rotated —
      #    see the script's own header. GitHub Actions automatically masks
      #    any of these secret VALUES if they ever appear in step output. ──
      - name: "[apply] Rotate passwords (writes password field only, on explicit targets)"
        if: ${{ inputs.mode == 'apply' }}
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd /opt/techvault &&
            docker compose exec -T \
              -e ROTATE_CONFIRM=TECHVAULT_PRODUCTION \
              -e ROTATE_SUPERADMIN_NEW_PASSWORD="${{ secrets.ROTATE_SUPERADMIN_NEW_PASSWORD }}" \
              -e ROTATE_SUPERADMIN_OLD_PASSWORD="${{ secrets.ROTATE_SUPERADMIN_OLD_PASSWORD }}" \
              -e ROTATE_ADMIN_NEW_PASSWORD="${{ secrets.ROTATE_ADMIN_NEW_PASSWORD }}" \
              -e ROTATE_ADMIN_OLD_PASSWORD="${{ secrets.ROTATE_ADMIN_OLD_PASSWORD }}" \
              -e ROTATE_WAREHOUSE_NEW_PASSWORD="${{ secrets.ROTATE_WAREHOUSE_NEW_PASSWORD }}" \
              -e ROTATE_WAREHOUSE_OLD_PASSWORD="${{ secrets.ROTATE_WAREHOUSE_OLD_PASSWORD }}" \
              -e ROTATE_ALICE_NEW_PASSWORD="${{ secrets.ROTATE_ALICE_NEW_PASSWORD }}" \
              -e ROTATE_ALICE_OLD_PASSWORD="${{ secrets.ROTATE_ALICE_OLD_PASSWORD }}" \
              -e ROTATE_BOB_NEW_PASSWORD="${{ secrets.ROTATE_BOB_NEW_PASSWORD }}" \
              -e ROTATE_BOB_OLD_PASSWORD="${{ secrets.ROTATE_BOB_OLD_PASSWORD }}" \
              -e ROTATE_CAROL_NEW_PASSWORD="${{ secrets.ROTATE_CAROL_NEW_PASSWORD }}" \
              -e ROTATE_CAROL_OLD_PASSWORD="${{ secrets.ROTATE_CAROL_OLD_PASSWORD }}" \
              backend node server/scripts/rotateProductionCredentials.js --apply
          '

      # ── Live smoke test, driven entirely by secrets — no plaintext
      #    password literal anywhere in this file. Only checks accounts
      #    that were actually targeted this run (both secrets present).
      #    Proves the real login API rejects the OLD password. Never prints
      #    a password value; GitHub Actions also masks any secret value that
      #    happens to appear in step output as defense in depth. ───────────
      - name: "[apply] Confirm the old password is now rejected by the real login API"
        if: ${{ inputs.mode == 'apply' }}
        env:
          SUPERADMIN_NEW: ${{ secrets.ROTATE_SUPERADMIN_NEW_PASSWORD }}
          SUPERADMIN_OLD: ${{ secrets.ROTATE_SUPERADMIN_OLD_PASSWORD }}
          ADMIN_NEW:      ${{ secrets.ROTATE_ADMIN_NEW_PASSWORD }}
          ADMIN_OLD:      ${{ secrets.ROTATE_ADMIN_OLD_PASSWORD }}
          WAREHOUSE_NEW:  ${{ secrets.ROTATE_WAREHOUSE_NEW_PASSWORD }}
          WAREHOUSE_OLD:  ${{ secrets.ROTATE_WAREHOUSE_OLD_PASSWORD }}
          ALICE_NEW:      ${{ secrets.ROTATE_ALICE_NEW_PASSWORD }}
          ALICE_OLD:      ${{ secrets.ROTATE_ALICE_OLD_PASSWORD }}
          BOB_NEW:        ${{ secrets.ROTATE_BOB_NEW_PASSWORD }}
          BOB_OLD:        ${{ secrets.ROTATE_BOB_OLD_PASSWORD }}
          CAROL_NEW:      ${{ secrets.ROTATE_CAROL_NEW_PASSWORD }}
          CAROL_OLD:      ${{ secrets.ROTATE_CAROL_OLD_PASSWORD }}
        run: |
          set -euo pipefail
          declare -A EMAILS=(
            [SUPERADMIN]="superadmin@techvault.dev"
            [ADMIN]="admin@techvault.dev"
            [WAREHOUSE]="warehouse@techvault.dev"
            [ALICE]="alice@example.com"
            [BOB]="bob@example.com"
            [CAROL]="carol@example.com"
          )
          FAILED=0
          for KEY in "${!EMAILS[@]}"; do
            NEW_VAR="${KEY}_NEW"; OLD_VAR="${KEY}_OLD"
            NEW_VAL="${!NEW_VAR:-}"; OLD_VAL="${!OLD_VAR:-}"
            if [ -z "$NEW_VAL" ] || [ -z "$OLD_VAL" ]; then
              echo "$KEY: not targeted this run — skipping old-password smoke test"
              continue
            fi
            EMAIL="${EMAILS[$KEY]}"
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              -X POST https://techvault.co.il/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -H "Origin: https://techvault.co.il" \
              -d "{\"email\":\"${EMAIL}\",\"password\":\"${OLD_VAL}\"}")
            echo "$KEY ($EMAIL): old-password login attempt returned HTTP $STATUS"
            if [ "$STATUS" == "200" ]; then
              echo "::error::$KEY ($EMAIL): old password STILL authenticates against the live API — rotation did not take effect"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "Confirmed: old password no longer authenticates for every rotated account checked."

      # ── Live smoke test proving the NEW password now authenticates.
      #    Discards the response body (never captures/prints the token). ───
      - name: "[apply] Confirm the new password now authenticates via the real login API"
        if: ${{ inputs.mode == 'apply' }}
        env:
          SUPERADMIN_NEW: ${{ secrets.ROTATE_SUPERADMIN_NEW_PASSWORD }}
          SUPERADMIN_OLD: ${{ secrets.ROTATE_SUPERADMIN_OLD_PASSWORD }}
          ADMIN_NEW:      ${{ secrets.ROTATE_ADMIN_NEW_PASSWORD }}
          ADMIN_OLD:      ${{ secrets.ROTATE_ADMIN_OLD_PASSWORD }}
          WAREHOUSE_NEW:  ${{ secrets.ROTATE_WAREHOUSE_NEW_PASSWORD }}
          WAREHOUSE_OLD:  ${{ secrets.ROTATE_WAREHOUSE_OLD_PASSWORD }}
          ALICE_NEW:      ${{ secrets.ROTATE_ALICE_NEW_PASSWORD }}
          ALICE_OLD:      ${{ secrets.ROTATE_ALICE_OLD_PASSWORD }}
          BOB_NEW:        ${{ secrets.ROTATE_BOB_NEW_PASSWORD }}
          BOB_OLD:        ${{ secrets.ROTATE_BOB_OLD_PASSWORD }}
          CAROL_NEW:      ${{ secrets.ROTATE_CAROL_NEW_PASSWORD }}
          CAROL_OLD:      ${{ secrets.ROTATE_CAROL_OLD_PASSWORD }}
        run: |
          set -euo pipefail
          declare -A EMAILS=(
            [SUPERADMIN]="superadmin@techvault.dev"
            [ADMIN]="admin@techvault.dev"
            [WAREHOUSE]="warehouse@techvault.dev"
            [ALICE]="alice@example.com"
            [BOB]="bob@example.com"
            [CAROL]="carol@example.com"
          )
          FAILED=0
          for KEY in "${!EMAILS[@]}"; do
            NEW_VAR="${KEY}_NEW"; OLD_VAR="${KEY}_OLD"
            NEW_VAL="${!NEW_VAR:-}"; OLD_VAL="${!OLD_VAR:-}"
            if [ -z "$NEW_VAL" ] || [ -z "$OLD_VAL" ]; then
              echo "$KEY: not targeted this run — skipping new-password smoke test"
              continue
            fi
            EMAIL="${EMAILS[$KEY]}"
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              -X POST https://techvault.co.il/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -H "Origin: https://techvault.co.il" \
              -d "{\"email\":\"${EMAIL}\",\"password\":\"${NEW_VAL}\"}")
            echo "$KEY ($EMAIL): new-password login attempt returned HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::$KEY ($EMAIL): new password does NOT authenticate against the live API"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "Confirmed: new password authenticates for every rotated account checked."

      # ── Same post-change health check pattern as deploy.yml. ───────────────
      - name: "[apply] Post-rotation production health check"
        if: ${{ inputs.mode == 'apply' }}
        run: |
          ssh -i "$SSH_KEY_PATH" -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'sudo /opt/techvault/devops/scripts/health-check.sh'

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$SSH_KEY_PATH"
