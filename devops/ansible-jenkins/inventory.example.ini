# Copy to inventory.ini and replace placeholders with real values.
# inventory.ini is gitignored — never commit real IPs or key paths.
#
# This targets the JENKINS HOST only (devops/terraform-jenkins/ output),
# never production and never the assignment application server.

[jenkins_assignment]
REPLACE_WITH_JENKINS_HOST_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/techvault-jenkins-key.pem

[jenkins_assignment:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
