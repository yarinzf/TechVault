# Copy to inventory.ini and replace placeholders with real values.
# inventory.ini is gitignored — never commit real IPs or key paths.
#
# This targets the DevOps ASSIGNMENT server only (devops/terraform-assignment/
# output), never the production host. When running via Jenkins, the
# assignment pipeline generates this file automatically from
# `terraform output -raw assignment_public_ip`. Use this file only for
# manual runs.

[techvault_assignment]
REPLACE_WITH_ASSIGNMENT_SERVER_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/techvault-assignment-key.pem

[techvault_assignment:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
